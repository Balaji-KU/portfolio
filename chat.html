<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills Section</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#fff;
    padding:40px;
    color:#111827;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    font-size:42px;
    margin-bottom:30px;
}

.section{
    margin-bottom:45px;
}

.section h2{
    font-size:30px;
    font-weight:600;
    margin-bottom:20px;
}

.skills{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
}

.skill{
    background:#020617;
    color:#fff;
    border-radius:10px;
    padding:14px 22px;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:18px;
    font-weight:500;
    min-width:150px;
    transition:.3s;
}

.skill:hover{
    transform:translateY(-3px);
    background:#111827;
}

.skill i{
    font-size:24px;
}
</style>
</head>

<body>

<div class="container">

<h1>Skills</h1>

<div class="section">
<h2>Frontend</h2>

<div class="skills">

<div class="skill"><i class="fa-brands fa-css3-alt"></i>CSS</div>
<div class="skill"><i class="fa-brands fa-html5"></i>HTML</div>
<div class="skill"><i class="fa-brands fa-js"></i>JavaScript</div>
<div class="skill"><i class="fa-brands fa-react"></i>React</div>
</div>

</div>

<div class="section">
<h2>Languages</h2>

<div class="skills">
<div class="skill"><i class="fa-brands fa-css3-alt"></i>CSS</div>
<div class="skill"><i class="fa-brands fa-html5"></i>HTML</div>
<div class="skill"><i class="fa-brands fa-js"></i>JavaScript</div>

</div>

</div>

</body>
</html>
